<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FDD — verificación de carga local</title>
<style>
 body{font:14px/1.5 system-ui,sans-serif;margin:2rem auto;max-width:60rem;padding:0 1rem;color:#1a1a1a}
 h1{font-size:1.3rem} h2{font-size:1rem;margin-top:1.6rem}
 table{border-collapse:collapse;margin:.5rem 0} td,th{border:1px solid #ccc;padding:.25rem .6rem;text-align:left}
 .ok{color:#0a7d32;font-weight:600} .mal{color:#b3261e;font-weight:600}
 code{background:#f2f2f2;padding:0 .25rem;border-radius:3px}
 p.nota{color:#555;font-size:.9rem}
</style>
</head>
<body>
<h1>Verificación de carga local — módulo FDD</h1>
<p class="nota">Esta página <strong>no es el visualizador</strong>. Es una autoprueba: confirma que
los cuatro archivos de datos cargan con doble clic bajo <code>file://</code>, sin servidor y sin
<code>fetch()</code>, y que la inferencia responde. Si algo falla aquí, fallará en el visualizador.</p>

<div id="salida">Cargando…</div>

<script src="datos/fdd_modelo.js"></script>
<script src="datos/fdd_fisica.js"></script>
<script src="datos/fdd_malla.js"></script>
<script src="datos/fdd_metricas.js"></script>
<script src="js/fdd_inferencia.js"></script>
<script>
(function () {
  var f = [], filas = [];
  function comp(nombre, cond, detalle) {
    filas.push('<tr><td>' + nombre + '</td><td class="' + (cond ? 'ok">correcto' : 'mal">FALLA')
               + '</td><td>' + (detalle || '') + '</td></tr>');
    if (!cond) f.push(nombre);
  }
  comp('FDD_MODELO cargado', typeof FDD_MODELO === 'object',
       FDD_MODELO.n_arboles + ' árboles, ' + FDD_MODELO.clases.length + ' clases');
  comp('FDD_FISICA cargado', typeof FDD_FISICA === 'object',
       FDD_FISICA.refrigerante + ', ' + FDD_FISICA.Q_nom_TR + ' TR (' + FDD_FISICA.Q_nom_W + ' W)');
  comp('FDD_MALLA cargada', typeof FDD_MALLA === 'object',
       FDD_MALLA.temperaturas_C.length + ' × ' + FDD_MALLA.cargas.length + ' × '
       + FDD_MALLA.nClases + ' × ' + FDD_MALLA.nSeveridades);
  comp('FDD_METRICAS cargadas', typeof FDD_METRICAS === 'object',
       'F1 macro prevalencia = ' + FDD_METRICAS.prevalencia_realista.f1_macro.toFixed(4));

  var e = FDD.consultar(32, 0.8, 'condensador_sucio', 0.75);
  comp('Consulta de la malla', isFinite(e.m_r) && isFinite(e.W_elec_W),
       'ṁ=' + e.m_r.toFixed(4) + ' kg/s, W=' + (e.W_elec_W / 1000).toFixed(1) + ' kW, régimen '
       + e._regimen + ', interpolación ' + e._interpolacion);

  var d = FDD.diagnosticar(32, 0.8, 'condensador_sucio', 0.75);
  comp('Inferencia del bosque', d.diagnostico.clase.length > 0,
       'diagnóstico: ' + d.diagnostico.clase + ' (confianza '
       + d.diagnostico.confianza.toFixed(3) + ')');

  // El clasificador se entrenó CON ruido de sensor y CON un gemelo desafinado:
  // clasificar los residuos limpios de la malla daría más acierto del que
  // reporta el informe. `diagnosticar` usa el bloque `res_ruidoso_*` y declara
  // con qué semilla, factor de ruido y nivel de discrepancia se generó.
  var cols = FDD_MODELO.columnas_entrada;
  comp('Clasifica los residuos CON ruido',
       d.residuos[cols[0]] === e[FDD_MALLA.residuo_ruidoso[cols[0]]]
       && d.residuos_limpios[cols[0]] !== undefined,
       'semilla ' + d.semilla + ', factor de ruido ' + d.factor_ruido
       + ', discrepancia ' + d.nivel_discrepancia + ' (' + d.modo_discrepancia + ')');

  // Defecto corregido: antes, cualquier consulta fuera del dominio se servía con
  // el valor del borde y sin marca alguna.
  var borde = FDD.consultar(37, 0.70, 'sano', 0);
  var lejos = FDD.consultar(50, 2.00, 'sano', 0);
  comp('Fuera de la malla: marca y rechazo',
       borde !== null && borde._extrapolado === true && lejos === null,
       'a 37 °C se sirve el borde marcado (' + borde._fuera_de_malla.ejes[0].eje
       + ', distancia ' + borde._fuera_de_malla.distancia_max.toFixed(2)
       + '); a 50 °C y carga 2,0 se rechaza');

  // Defecto corregido: `Math.fround(null)` vale 0, así que los nodos sin estado
  // estacionario entraban al bosque como una máquina perfectamente sana.
  var sinEstado = null, nSinEstado = 0;
  (function () {
    var M = FDD_MALLA, nQ = M.cargas.length, nC = M.nClases, nS = M.nSeveridades;
    for (var i = 0; i < M.discretos.convergio.length; i++) {
      if (M.discretos.convergio[i] !== 0) continue;
      nSinEstado++;
      if (sinEstado !== null) continue;
      var s = i % nS, cl = Math.floor(i / nS) % nC;
      var q = Math.floor(i / (nS * nC)) % nQ, t = Math.floor(i / (nS * nC * nQ));
      sinEstado = FDD.diagnosticar(M.temperaturas_C[t], M.cargas[q],
                                   M.clases[cl], M.severidades[s]);
    }
  })();
  comp('Sin estado estacionario: se rechaza',
       sinEstado !== null && sinEstado.diagnostico === null,
       nSinEstado + ' nodos sin solución física; el primero devuelve '
       + (sinEstado && sinEstado.diagnostico === null ? 'null' : 'una clase')
       + ' («' + (sinEstado ? sinEstado.motivo : '') + '»)');

  // El dataset se muestreó con carga >= 0,40 y la malla baja hasta 0,28 para
  // poder dibujar la zona de ciclado. Ahí el clasificador no vio nada.
  var dom = FDD_MALLA.dominio_entrenamiento;
  var baja = FDD.diagnosticar(30, 0.30, 'condensador_sucio', 0.75);
  comp('Fuera del dominio de entrenamiento: no se diagnostica',
       baja.fuera_de_entrenamiento === true && baja.diagnostico === null
       && isFinite(baja.estado.T4_C),
       'entrenado en carga [' + dom.Q_load_frac[0] + ', ' + dom.Q_load_frac[1] + '] y '
       + dom.T_amb_C[0] + '–' + dom.T_amb_C[1] + ' °C; a carga 0,30 se devuelve el estado '
       + 'del ciclo pero no un diagnóstico');

  var s = FDD.consultar(30, 0.30, 'sano', 0);
  comp('Zona de ciclado documentada', typeof s.fraccion_marcha === 'number',
       'carga 0,30: ciclado=' + s.ciclado + ', fracción de marcha='
       + (s.fraccion_marcha === null ? '—' : s.fraccion_marcha.toFixed(3)));

  var q = FDD.cargaDesdeVatios(0.6 * FDD_FISICA.Q_nom_W);
  comp('Demanda en vatios → fracción de carga', Math.abs(q - 0.6) < 1e-9, 'q = ' + q.toFixed(4));

  document.getElementById('salida').innerHTML =
    '<h2>' + (f.length === 0
      ? '<span class="ok">Los cinco archivos cargan bajo file:// y la inferencia responde.</span>'
      : '<span class="mal">' + f.length + ' comprobaciones fallan: ' + f.join(', ') + '</span>')
    + '</h2><table><tr><th>Comprobación</th><th>Resultado</th><th>Detalle</th></tr>'
    + filas.join('') + '</table>'
    + '<p class="nota">La equivalencia exacta con scikit-learn se verificó aparte, con '
    + '<code>pytest tests/test_exportador.py</code>: 1997 muestras, clase idéntica sin '
    + 'tolerancia y probabilidades iguales bit a bit. <strong>Esa comprobación no es '
    + 'reproducible desde un clon limpio</strong>: necesita '
    + '<code>resultados/modelo_rf.joblib</code>, que está excluido del repositorio por '
    + 'tamaño. El contrato de comportamiento que se ve arriba sí se verifica siempre, con '
    + '<code>pytest tests/test_inferencia_js.py</code>, que no necesita ese artefacto.</p>';
})();
</script>
</body>
</html>
